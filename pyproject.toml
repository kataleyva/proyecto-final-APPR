[project]
name = "proyecto-final-appr"
version = "0.1.0"
description = "Proyecto final APPR - 2026II"
authors = [
    {name = "kataleyva",email = "katalinamleyvad@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.1.0,<4.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "nltk (>=3.10.4,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "torch (>=2.15.0,<3.0.0)",
    "transformers (>=5.22.1,<6.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "kaggle (>=2.2.5,<3.0.0)",
    "dvc (>=3.67.1,<4.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
